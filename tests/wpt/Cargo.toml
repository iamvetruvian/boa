[package]
name = "boa_wpt"
publish = false
version = "0.1.0"
edition = "2021"

[dependencies]
boa_engine = { path = "../../core/engine" }
boa_gc = { path = "../../core/gc" }
boa_outcomes = { path = "../outcomes" }
boa_runtime = { path = "../../core/runtime", features = ["all"] }
rstest = "0.25.0"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1" }
time = { version = "0.3", features = ["formatting"] }
toml = { version = "0.8.23" }
url = { version = "2.5.4", features = [] }

[[bin]]
name = "wpt-report"
path = "src/bin/wpt_report.rs"

[build-dependencies]
git2 = "0.20.2"
toml = "0.8.23"
serde = { version = "1.0.219", features = ["derive"] }
