title = "Deep syntactic nesting aborts the parser (SIGABRT) instead of throwing"
status = "landed"
reproducer = "cases/parser-deep-nesting-stack-overflow/repro.js"
expect = "throw SyntaxError"
layer = "parser/recursion-limit"
unit_test = "core/parser/src/parser/tests/mod.rs::deep_nesting_hits_depth_limit"
no_test262_reason = "No Test262 test nests syntax near engine limits (deepest corpus nesting is tens of levels); abort needs ~300 expression levels. Found by the P4.3 source-bytes harness (100 unbalanced parens overflowed a 2 MB unit-test stack)."
fuzz_seed = "tests/fuzz/seeds/parser-deep-nesting-stack-overflow.js"
symptom = "300 nested parens (or 500 brackets) abort: thread 'main' has overflowed its stack (SIGABRT, exit 134); 200 evaluates fine. jsshell evaluates 500-deep and throws a catchable InternalError only past ~1000."
root_cause = "The recursive-descent parser has no depth accounting: each paren level costs ~150 KB of native stack in dev builds (an 18-frame precedence cascade with unoptimized match temps, measured via gdb), so ~15 levels exhaust a 2 MB test thread and ~300 exhaust 32 MB. A fixed depth counter cannot serve both dev/2MB and release/8MB, so the fix is a stack-aware guard (rust-lang/stacker remaining_stack, 256 KB red zone) at the 8 recursion choke points (primary, statement, both binding patterns, unary, assignment, exponentiation, member), returning a catchable SyntaxError past the limit. The effective depth adapts to stack/profile like SpiderMonkey/V8; frame-diet tuning for deeper acceptance is project-1 work. Fix promise: abort -> clean error."
spec = "https://tc39.es/ecma262/#sec-ecmascript-language-scripts-and-modules"
fix_commit = "pending"
finder = "P4-fuzz-harness"
added = "2026-10-03"

