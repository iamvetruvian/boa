[[entries]]
id = "await-recursion-engine-panic"
title = "Re-entrant await past the recursion limit surfaces EnginePanic instead of RangeError"
status = "open"
reproducer = "cases/await-recursion-engine-panic/repro.js"
expect = "pass"
layer = "engine/vm/async"
unit_test = "core/engine/src/vm/opcode/await/mod.rs::await_recursion_limit_surfaces_range_error"
no_test262_reason = "Constructor getters are covered single-level only (then/ctor-poisoned.js throws once through .then); no suite test re-enters await through one (verified: zero `await` hits across all 6 constructor-mentioning Promise tests). Recursion-limit trips are host-defined (Boa: 512 VM frames; V8: stack overflow), so the suite pins neither the trip nor the error kind. Runner note: Context::eval does not drain the job queue, so the RangeError rejection is pinned by the Rust unit test, not the JS repro."
fuzz_seed = "tests/fuzz/seeds/await-recursion-engine-panic.js"
symptom = "A pending promise whose `constructor` getter re-enters `await` on it (3-line minimized shape) surfaces `Uncaught Error: EnginePanic: cannot fail per spec` (exit 1; the Fuzzilli adapter aborts on it) once past ~100-200 re-entrant levels (100 clean, 200 trips); node v26 completes the script with the inner promise rejected by RangeError (unhandled rejection)."
root_cause = "Depth-triggered, consistent with the default 512-frame recursion limit (vm/runtime_limits.rs): each re-entrant await level pushes several VM frames, and the RuntimeLimitError::Recursion trip inside the await path is laundered into an opaque catchable EnginePanic by a `cannot fail per spec` js_expect (lib.rs JsExpect::js_expect wraps any JsError as PanicError with the original as source). Fix-loop to confirm the exact site via the error source chain (prime candidate: Await's PromiseCapability::new, await/mod.rs:173 — the only such site reachable from the minimized shape) and choose: (a) surface catchable RangeError (V8-identical, cyclic-proto precedent) — the JS repro then guards it; or (b) propagate the engine error uncatchable — then per rule 2 the Rust test is the only guard and the JS repro stays documentary."
spec = "https://tc39.es/ecma262/#sec-await"
fix_commit = "pending"
finder = "P4-fuzzilli"
added = "2026-10-03"

[[entries]]
id = "dce-dead-branch-completion-leak"
title = "DCE replaces falsy if/while/for with Empty, leaking the previous completion"
status = "open"
reproducer = "cases/dce-dead-branch-completion-leak/repro.js"
expect = "pass"
layer = "engine/optimizer/dce"
unit_test = "core/engine/src/optimizer/pass/dead_code_elimination.rs::dce_falsy_branch_without_else_completes_undefined"
no_test262_reason = "The suite runner optimizes only with --optimize/-O (default off), so no standard suite run exercises DCE at all; the bug additionally needs a prior completion plus a dead-branch-last statement, a shape no completion test pairs with an optimized run. Fix loop: run the suite once with -O (or add an optimized-suite gate) alongside the Rust test."
fuzz_seed = "tests/fuzz/seeds/dce-dead-branch-completion-leak.js"
symptom = "Under the optimizer (default engine contexts, `boa_cli -O`): `0; if (false) { 1; }` completes 0 (node v26: undefined); same for `0; while (false) { 1; }` and `0; for (;false;) { 1; }`. Unoptimized contexts are correct on all three."
root_cause = "DeadCodeElimination::{try_eliminate_if,try_eliminate_while,try_eliminate_for} replace the dead statement with `Statement::Empty`, which completes empty and therefore inherits the previous completion at statement-list level. Per ECMA-262 the falsy/no-iteration path completes `undefined` (if: 14.6.2 step 3; while: 14.7.2, V stays undefined; for: 14.7.3 likewise). Fix: replace with an `undefined`-completing statement (e.g. expression statement `undefined`) instead of `Empty`, at all three sites (dead_code_elimination.rs:96,112,140)."
spec = "https://tc39.es/ecma262/#sec-if-statement"
fix_commit = "pending"
finder = "P5-metamorphic"
added = "2026-10-03"

