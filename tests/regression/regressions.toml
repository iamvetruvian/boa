layer = "parser/statements/variable"
unit_test = "core/parser/src/parser/statement/variable/mod.rs::destructuring_pattern_requires_initializer"
no_test262_reason = "No Test262 test covers missing pattern initializers (zero tests mention the V8 diagnostic; all dstr negatives target rest-element/reference errors). Found by the P4.2 fuzz probe: 500 generated programs vs jsshell (494 agree, 3 mismatch) with node adjudication."
fuzz_seed = "tests/fuzz/seeds/destructuring-missing-initializer.js"
symptom = "var []; / let [a]; / var {}; / let {}; / for (var [a];;); parse (reached code throws TypeError at runtime); V8 + jsshell throw SyntaxError at parse on all six."
root_cause = "The shared Variable parser (variable/mod.rs:164-204) and LexicalBinding accept init=None for binding patterns; the grammar requires Initializer after patterns for var/let/const alike. The const path already guards (lexical.rs:247-264 requires_initializer + for-statement post-hoc rejection, verified working for const patterns). Fix model: mirror the const guard for patterns (exempting for-in/of LHS, which correctly accepts init-less patterns via a separate path)."
spec = "https://tc39.es/ecma262/#sec-variable-statement-static-semantics-early-errors"
fix_commit = "pending"
finder = "P4-fuzz-probe"
added = "2026-10-03"

