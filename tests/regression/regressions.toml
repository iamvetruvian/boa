root_cause = "Uninvestigated (fix-loop): using-declarations compile via emit_binding(InitLexical) (bytecompiler/mod.rs:2341/2382) but the top-scope declarative env holds 0 slots when PutLexicalValue initializes binding 0 — the binding is never counted into the top-scope env, while nested blocks size theirs correctly. No function-body or script-top `using` currently works. Note: the using suite's function-body tests (e.g. the cited file, which disposes a valid resource at end of function body) execute exactly this shape and abort on Boa (shape verified via CLI)."
spec = "https://tc39.es/proposal-explicit-resource-management/"
