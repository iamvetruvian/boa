[[entries]]
id = "string-at-negative-overflow"
title = "String.prototype.at with an INT64_MIN index aborts on negate overflow"
status = "open"
reproducer = "cases/string-at-negative-overflow/repro.js"
expect = "pass"
layer = "engine/builtins/string"
unit_test = "core/engine/src/builtins/string/mod.rs::at_int64_min_index_returns_undefined"
no_test262_reason = "The suite's out-of-range test asserts only -2/0/1 (verified: zero hits for `Infinity` or 10+-digit literals in test/built-ins/String/prototype/at/ at the pinned checkout); no test indexes .at() near INT64_MIN."
fuzz_seed = "tests/fuzz/seeds/string-at-negative-overflow.js"
symptom = "`(\"function\").at(\"-9223372036854775807\")` aborts dev builds: `attempt to negate with overflow` at builtins/string/mod.rs:541; node v26 returns undefined."
root_cause = "ToNumber of the index rounds to -2^63 in f64 (verified: Number(\"-9223372036854775807\") === -9223372036854775808), so ToIntegerOrInfinity yields Integer(INT64_MIN) and the `(-i) <= len` guard negates INT64_MIN. Fix model: compare without negating (e.g. `i >= -len`). The `(-i)` pattern is unique to String.prototype.at (no Array/TypedArray siblings). Release builds wrap the negate but then trip get_expect's OOB expect, so they abort too (by code reading; the dev abort is verified)."
spec = "https://tc39.es/ecma262/#sec-string.prototype.at"
fix_commit = "pending"
finder = "P4-fuzzilli"
added = "2026-10-03"

