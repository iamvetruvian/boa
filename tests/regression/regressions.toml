[[entries]]
id = "cyclic-proto-walk-stack-overflow"
title = "Property walk on a proxy-mediated prototype cycle aborts instead of throwing"
status = "landed"
reproducer = "cases/cyclic-proto-walk-stack-overflow/repro.js"
expect = "throw RangeError"
layer = "engine/object/prototype"
unit_test = "core/engine/src/object/tests.rs::cyclic_prototype_walk_throws"
no_test262_reason = "Test262's set-cycle-shadowed.js creates the cycle but never walks it (it only asserts getPrototypeOf); the abort needs a subsequent property lookup (e.g. leaf.toString), reached here via differential state rendering."
fuzz_seed = "tests/fuzz/seeds/cyclic-proto-walk-stack-overflow.js"
symptom = "leaf.toString on root->leaf->proxy->root cycle aborts: thread 'main' has overflowed its stack (SIGABRT, exit 134)"
root_cause = "OrdinarySetPrototypeOf correctly permits proxy-mediated cycles (walk stops at non-ordinary objects), but Boa's prototype-chain property lookup recurses natively: plain JS recursion throws catchable RuntimeLimitError, this path overflows the Rust stack. (The filed fix model — consulting the VM recursion limit — was wrong: that limit counts VM frames, and the walk pushes none, so it is blind here.) Fixed by a stack-aware guard (rust-lang/stacker, 256 KB red zone) at the 3 recursive walks (ordinary get/set/has) plus a 100k-link budget on the 3 iterative ones (instanceof, isPrototypeOf, legacy lookup — stack-flat loops that hung instead of crashing, untrippable by any stack check), all throwing native catchable RangeError('Maximum call stack size exceeded') — V8-identical shape and message, verified against node v26 (jsshell throws InternalError). Unifying plain-JS-recursion's engine error to RangeError is project-1 follow-up."
spec = "https://tc39.es/ecma262/#sec-object.prototype.__proto__"
fix_commit = "pending"
finder = "P3-differential"
added = "2026-10-03"

