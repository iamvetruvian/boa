root_cause = "The AST generator emits a Yield expression as a computed method key outside any generator body; it prints as bare [yield], and the reparse (non-generator enclosing context) interns identifier yield, outside the pre-parse Sym universe. Engine parse/print are faithful on both sides; the drift is generator context-inconsistency. Follow-up: constrain Yield emission to generator bodies or extend the universe to keyword spellings."
