[package]
name = "boa_differential"
description = "Differential testing pipeline: run the same programs on Boa and a pinned oracle engine, normalize, triage."
keywords = ["javascript", "ECMAScript", "differential-testing"]
categories = ["command-line-utilites"]
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "boa_differential"
path = "src/main.rs"

[dependencies]
boa_engine = { workspace = true, features = ["float16"] }
boa_gc.workspace = true
boa_outcomes = { path = "../../tests/outcomes" }
boa_runtime = { workspace = true }
clap = { workspace = true, features = ["derive"] }
cow-utils.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml = "0.9.34"
toml.workspace = true
color-eyre.workspace = true
rayon.workspace = true
time.workspace = true

[features]
annex-b = ["boa_engine/annex-b", "boa_runtime/annex-b"]
default = ["boa_engine/intl_bundled", "boa_engine/experimental", "annex-b"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
