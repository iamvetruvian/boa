name: wpt

on:
  # Host suites on a schedule and on release-candidate tags. The gate is
  # zero-untriaged: every non-passing file must match an audited ignore
  # entry in `test_wpt_config.toml`.
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  wpt:
    name: WPT host suites (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: boa

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # pinned stable
        with:
          toolchain: 1.94.0

      - name: Install mold linker
        uses: rui314/setup-mold@7d6d806a11c987c44a653b11f8e2f0cbd9a1a225c # v1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run WPT suites (counted outcomes)
        run: |
          cd boa/tests/wpt
          export WPT_ROOT="$PWD/../../tests_wpt"
          export WPT_OUT="$PWD/../../../results/wpt"
          rm -rf "$WPT_OUT"
          cargo test --lib

      - name: Gate on zero untriaged
        run: |
          cd boa/tests/wpt
          export WPT_ROOT="$PWD/../../tests_wpt"
          cargo run --bin wpt-report -- ../../../results/wpt/records.jsonl \
            --out ../../../results/wpt

      - name: Upload WPT results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6f1d0e05d4a878c7efc75283e63f # v6.0.0
        with:
          name: wpt-results
          path: results/wpt
