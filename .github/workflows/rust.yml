name: Continuous integration

on:
  pull_request:
    branches:
      - main
      - releases/**
  push:
    branches:
      - main
      - releases/**
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  W_FLAGS: ${{ (github.ref == 'refs/heads/main' || github.base_ref == 'main') && '-D warnings' || '' }}

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Set environment
        run: |
          target=$(rustc -vV | awk '/^host/ { print $2 }' | tr [:lower:] [:upper:] | tr '-' '_')
          echo "CARGO_TARGET_${target}_RUSTFLAGS=$W_FLAGS" >> $GITHUB_ENV
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # pinned stable
        with:
          toolchain: 1.94.0
          components: rustfmt

      - name: Format (rustfmt)
        run: cargo fmt --all --check

  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for typos
        uses: crate-ci/typos@512fc24f32f44ab01972217aaaf3dc86ec234d53 # v1.50.2

  baseline:
    name: Baseline pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # pinned stable
        with:
          toolchain: 1.94.0

      - name: Verify baseline pins
        run: bash scripts/verify-baseline.sh

  unsafe_inventory:
    name: Unsafe inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check unsafe inventory is current and fully audited
        run: bash scripts/check-unsafe-inventory.sh

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Set environment
        run: |
          target=$(rustc -vV | awk '/^host/ { print $2 }' | tr [:lower:] [:upper:] | tr '-' '_')
          echo "CARGO_TARGET_${target}_RUSTFLAGS=$W_FLAGS" >> $GITHUB_ENV
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # pinned stable
        with:
          toolchain: 1.94.0
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-workspaces
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-workspaces

      - name: Clippy (All features)
        run: cargo workspaces exec cargo clippy --all-features --all-targets
      - name: Clippy (No features)
        run: cargo workspaces exec cargo clippy --no-default-features --all-targets
      - name: Clippy (Intl)
        run: cargo clippy -p boa_engine --features intl
      - name: Clippy (Annex-B)
        run: cargo clippy -p boa_engine --features annex-b
      - name: Clippy (Experimental)
        run: cargo clippy -p boa_engine --features experimental

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTDOCFLAGS: ${{ (github.ref == 'refs/heads/main' || github.base_ref == 'main') && '-D warnings' || '' }}
    steps:
      - name: Set environment
        run: |
          target=$(rustc -vV | awk '/^host/ { print $2 }' | tr [:lower:] [:upper:] | tr '-' '_')
          echo "CARGO_TARGET_${target}_RUSTFLAGS=$W_FLAGS" >> $GITHUB_ENV
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # pinned stable
        with:
          toolchain: 1.94.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Generate documentation
        run: cargo doc -v --document-private-items --all-features

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Set environment
        run: |
          target=$(rustc -vV | awk '/^host/ { print $2 }' | tr [:lower:] [:upper:] | tr '-' '_')
          echo "CARGO_TARGET_${target}_RUSTFLAGS=$W_FLAGS" >> $GITHUB_ENV
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Get the rust_version from the Cargo.toml
      - name: Get rust_version
        id: rust_version
        run: echo "rust_version=$(grep '^rust-version' Cargo.toml | cut -d' ' -f3 | tr -d '"')" >> $GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # MSRV from Cargo.toml
        with:
          toolchain: ${{ steps.rust_version.outputs.rust_version }}

      - name: Check compilation
        # `rust-toolchain.toml` pins stable; the MSRV check must run on the
        # minimum supported version instead (see `docs/baseline.md`).
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.rust_version.outputs.rust_version }}
        run: cargo check --all-features --all-targets

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
    needs:
      - fmt
      - typos
      - clippy
      - docs
      - msrv
    steps:
      - name: Set environment
        # Setting `RUSTFLAGS` overrides any flags set on .cargo/config.toml, so we need to
        # set the target flags instead which are cumulative.
        # Track https://github.com/rust-lang/cargo/issues/5376
        run: |
          target=$(rustc -vV | awk '/^host/ { print $2 }' | tr [:lower:] [:upper:] | tr '-' '_')
          echo "CARGO_TARGET_${target}_RUSTFLAGS=$W_FLAGS" >> $GITHUB_ENV
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # pinned stable
        with:
          toolchain: 1.94.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-tarpaulin
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-tarpaulin

      - name: Run tarpaulin
        run: cargo tarpaulin --workspace --features annex-b,intl_bundled,experimental --ignore-tests --engine llvm --timeout 180 --out xml

      - name: Upload to codecov.io
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5

  tests:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs:
      - fmt
      - typos
      - clippy
      - docs
      - msrv
    env:
      RUSTUP_WINDOWS_PATH_ADD_BIN: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
          - os: windows-latest
          - os: ubuntu-24.04-arm
          - os: ubuntu-latest
    steps:
      - name: Set environment
        if: ${{ matrix.os != 'windows-latest' }}
        # Setting `RUSTFLAGS` overrides any flags set on .cargo/config.toml, so we need to
        # set the target flags instead which are cumulative.
        # Track https://github.com/rust-lang/cargo/issues/5376
        run: |
          target=$(rustc -vV | awk '/^host/ { print $2 }' | tr '[:lower:]' '[:upper:]' | tr '-' '_')
          echo "CARGO_TARGET_${target}_RUSTFLAGS=$W_FLAGS" >> $GITHUB_ENV
      - name: Set environment
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          $target = (rustc -vV | Select-String '^host') -replace '^host:\s+', '' | ForEach-Object { $_.ToUpper().Replace('-', '_') }
          "CARGO_TARGET_${target}_RUSTFLAGS=$env:W_FLAGS" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # pinned stable
        with:
          toolchain: 1.94.0

      - name: Install Cargo insta
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-insta
          locked: true

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build tests
        run: cargo test --no-run --profile ci
      # this order is faster according to rust-analyzer
      - name: Build
        run: cargo build --all-targets --quiet --profile ci --features annex-b,intl_bundled,experimental,embedded_lz4
      - name: Install latest nextest
        uses: taiki-e/install-action@7cb3ba7bc31801346db00d4a6d7008aabab5e986 # nextest
      - name: Test with nextest
        run: cargo nextest run --profile ci --cargo-profile ci --features annex-b,intl_bundled,experimental,embedded_lz4
      - name: Test docs
        run: cargo test --doc --profile ci --features annex-b,intl_bundled,experimental
      - name: Test bytecode output
        run: cargo insta test -p insta-bytecode

  cross-tests:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - fmt
      - typos
      - clippy
      - docs
      - msrv
    strategy:
      matrix:
        include:
          - target: i686-unknown-linux-gnu
    steps:
      - name: Set environment
        # Setting `RUSTFLAGS` overrides any flags set on .cargo/config.toml, so we need to
        # set the target flags instead which are cumulative.
        # Track https://github.com/rust-lang/cargo/issues/5376
        run: |
          target=$(echo ${{ matrix.target }} | tr [:lower:] [:upper:] | tr '-' '_')
          echo "CARGO_TARGET_${target}_RUSTFLAGS=$W_FLAGS" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # pinned stable
        with:
          toolchain: 1.94.0
          target: ${{ matrix.target }}

      - name: Install Cross
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cross
          git: https://github.com/cross-rs/cross

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run tests
        run: |
          cross test --workspace --target ${{ matrix.target }} \
            --profile ci \
            --features annex-b,intl_bundled,experimental \
            --exclude boa_macros \
            --exclude boa_macros_tests

  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # `rust-toolchain.toml` pins stable; Miri needs nightly, so override the
    # file for every step of this job (see `docs/baseline.md`).
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-01
    needs:
      - fmt
      - typos
      - clippy
      - docs
      - msrv
    steps:
      - name: Set environment
        # Setting `RUSTFLAGS` overrides any flags set on .cargo/config.toml, so we need to
        # set the target flags instead which are cumulative.
        # Track https://github.com/rust-lang/cargo/issues/5376
        run: |
          target=$(rustc -vV | awk '/^host/ { print $2 }' | tr [:lower:] [:upper:] | tr '-' '_')
          echo "CARGO_TARGET_${target}_RUSTFLAGS=$W_FLAGS" >> $GITHUB_ENV
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly with miri
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # pinned nightly
        with:
          toolchain: nightly-2026-10-01
          components: miri

      - name: Setup miri
        run: cargo miri setup

      - name: Check miri filter gate
        run: bash scripts/check-miri-filter.sh

      - name: Run miri tests
        # NOTE: fuzz-harness members are excluded: they enable
        # `boa_engine/fuzz` workspace-wide, which activates the
        # zero-default instruction budget and fails JS-running tests.
        # `scripts/check-miri-filter.sh` enforces this list.
        # NOTE: `--test-threads=1`: one Context-building test costs ~3GB RSS
        # under Miri; even 2-way parallelism OOM-killed a 15GB runner
        # (proven 2026-10-04, anon-rss 6.4GB at 2 threads, 6.9GB at 16).
        # The gate script enforces this throttle too.
        run: cargo miri test --workspace --exclude boa_cli --exclude boa_examples --exclude boa_fuzz --exclude boa_fuzzilli miri -- --test-threads=1

  # P7.2: per-PR mutation sample. Mutants are selected by the PR's own diff
  # (--in-diff takes a diff FILE: `git diff base...HEAD -- core/`), scoped to
  # touched packages plus the engine suite (leaf-crate behavior is mostly
  # tested upstream). Sampled runs gate with --threshold 0: a rate bar on a
  # 5-mutant sample is noise, so the bar is FULL ACCOUNTING instead — every
  # survivor must be killed by a new test in the PR or justified in
  # docs/mutation-survivors.md (reviewed like an ignore entry). No core diff
  # (docs-only PRs) exits 0 immediately. `core/<x>` maps to `boa_<x>` for all
  # ten core dirs (verified 2026-10-04).
  mutation_sample:
    name: Mutation sample (PR diff)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
      - fmt
      - typos
      - clippy
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # pinned stable
        with:
          toolchain: 1.94.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked

      - name: Mutate touched code
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          git diff "$BASE"...HEAD -- core/ > /tmp/pr.diff
          [ -s /tmp/pr.diff ] || { echo "no core changes; skipping"; exit 0; }
          DIRS=$(grep -oP '^diff --git a/core/\K[^/]+' /tmp/pr.diff | sort -u)
          PFLAGS=""; TFLAGS="--test-package boa_engine"
          for d in $DIRS; do
            PFLAGS="$PFLAGS -p boa_$d"
            TFLAGS="$TFLAGS --test-package boa_$d"
          done
          # shellcheck disable=SC2086
          MUTANTS_EXTRA_ARGS="--in-diff /tmp/pr.diff" \
            bash scripts/run-mutation.sh $PFLAGS $TFLAGS \
              --threshold 0 -o target/mutants-pr

  build-fuzz:
    name: Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - fmt
      - typos
      - clippy
      - docs
      - msrv
    steps:
      - name: Set environment
        run: |
          target=$(rustc -vV | awk '/^host/ { print $2 }' | tr [:lower:] [:upper:] | tr '-' '_')
          echo "CARGO_TARGET_${target}_RUSTFLAGS=$W_FLAGS" >> $GITHUB_ENV
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # pinned stable
        with:
          toolchain: 1.94.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-fuzz
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-fuzz

      - name: Build fuzz
        run: cd tests/fuzz && cargo fuzz build -s none --dev

      - name: Test fuzz harness library
        run: cd tests/fuzz && cargo test --lib

  fuzz-smoke:
    name: Fuzz smoke (per-PR gate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `cargo fuzz run` needs nightly (libFuzzer instrumentation); reuse the
    # P0 pinned nightly via the same override pattern as the Miri job.
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-01
    needs:
      - fmt
      - typos
      - clippy
      - docs
      - msrv
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly with rust-src
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # pinned nightly
        with:
          toolchain: nightly-2026-10-01
          components: rust-src

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-fuzz
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-fuzz

      - name: Sync regression seeds into corpora
        run: cd tests/fuzz && ./sync-seeds.sh

      - name: Smoke parser-idempotency (300s, fixed seed)
        run: cd tests/fuzz && cargo fuzz run --dev -s none parser-idempotency -- -max_total_time=300 -seed=42

      - name: Smoke vm-implied (300s, fixed seed)
        run: cd tests/fuzz && cargo fuzz run --dev -s none vm-implied -- -max_total_time=300 -seed=42

      - name: Smoke bytecompiler-implied (300s, fixed seed)
        run: cd tests/fuzz && cargo fuzz run --dev -s none bytecompiler-implied -- -max_total_time=300 -seed=42

      - name: Smoke source-bytes (120s, fixed seed)
        run: cd tests/fuzz && cargo fuzz run --dev -s none source-bytes -- -max_total_time=120 -seed=42

      - name: Smoke module-specifier (120s, fixed seed)
        run: cd tests/fuzz && cargo fuzz run --dev -s none module-specifier -- -max_total_time=120 -seed=42

      - name: Smoke url-parse (120s, fixed seed)
        run: cd tests/fuzz && cargo fuzz run --dev -s none url-parse -- -max_total_time=120 -seed=42

      - name: Smoke fetch-response (120s, fixed seed)
        run: cd tests/fuzz && cargo fuzz run --dev -s none fetch-response -- -max_total_time=120 -seed=42

      - name: Smoke cli-exec (120s, fixed seed)
        run: cd tests/fuzz && cargo fuzz run --dev -s none cli-exec -- -max_total_time=120 -seed=42

      - name: Cache oracle binary
        uses: actions/cache@9255dc2d030a5baf3d63b345a4ffbef6b8a67427f # v10.0.0
        with:
          path: target/oracle
          key: oracle-${{ hashFiles('scripts/fetch-oracle.sh') }}

      - name: Fetch pinned oracle
        run: bash scripts/fetch-oracle.sh

      - name: Differential smoke vm-implied vs oracle (120s, fixed seed)
        env:
          BOA_FUZZ_ORACLE: ${{ github.workspace }}/target/oracle/js
        run: cd tests/fuzz && cargo fuzz run --dev -s none vm-implied -- -max_total_time=120 -seed=7

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6f1d0e05d4a878c7efc75283e63f # v6.0.0
        with:
          name: fuzz-smoke-crashes
          path: tests/fuzz/artifacts/
          retention-days: 14

  build-run-examples:
    name: Build & run examples
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - fmt
      - typos
      - clippy
      - docs
      - msrv
    steps:
      - name: Set environment
        run: |
          target=$(rustc -vV | awk '/^host/ { print $2 }' | tr [:lower:] [:upper:] | tr '-' '_')
          echo "CARGO_TARGET_${target}_RUSTFLAGS=$W_FLAGS" >> $GITHUB_ENV
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # pinned stable
        with:
          toolchain: 1.94.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-workspaces
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-workspaces

      - name: Build (All features)
        run: cargo workspaces exec cargo build --all-features --all-targets --profile ci
      - name: Build (No features)
        run: cargo workspaces exec cargo build --no-default-features --all-targets --profile ci

      - name: Run examples
        run: |
          cd examples
          cargo run -p boa_examples --bin 2>&1 \
            | grep -E '^ ' \
            | xargs -n1 sh -c 'cargo run -p boa_examples --profile ci --bin $0 || exit 255'

  run-semver-check:
    name: Check SemVer compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - fmt
      - typos
      - clippy
      - docs
      - msrv
    steps:
      - name: Set environment
        run: |
          target=$(rustc -vV | awk '/^host/ { print $2 }' | tr [:lower:] [:upper:] | tr '-' '_')
          echo "CARGO_TARGET_${target}_RUSTFLAGS=$W_FLAGS" >> $GITHUB_ENV
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check Semver
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          exclude: boa_wintertc
