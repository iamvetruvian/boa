name: test262

on:
  pull_request:
    branches:
      - main
      - releases/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run_test262:
    name: Run the test262 test suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: boa
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # pinned stable
        with:
          toolchain: 1.94.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Checkout the data repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: boa-dev/data
          path: data
          persist-credentials: false

      - name: Run the test262 test suite
        run: |
          cd boa
          mkdir -p ../results/test262
          cargo run --release -p boa_tester --bin boa_tester -- run -v -o ../results/test262
          cd ..

      - name: Verify Test262 pin
        run: |
          cd boa
          bash scripts/verify-baseline.sh --test262-only

  test262-subset:
    name: Test262 affected subsets (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the affected-subset mapping can diff against base.
          fetch-depth: 0
          path: boa

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # pinned stable
        with:
          toolchain: 1.94.0

      - name: Install mold linker
        uses: rui314/setup-mold@7d6d806a11c987c44a653b11f8e2f0cbd9a1a225c # v1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build tester
        run: |
          cd boa
          cargo build --release -p boa_tester --bin boa_tester

      - name: Lint tester config
        run: |
          cd boa
          cargo run --release -p boa_tester --bin boa_tester -- check-config --report

      - name: Compute affected subsets
        id: subsets
        run: |
          cd boa
          {
            echo "list<<EOF"
            bash scripts/affected-subsets.sh "${{ github.event.pull_request.base.sha }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run affected subsets
        run: |
          cd boa
          mkdir -p ../results/subsets
          while IFS= read -r subset; do
            [ -z "$subset" ] && continue
            safe=$(echo "$subset" | tr '/' '_')
            ./target/release/boa_tester run -v --timeout 60 -s "$subset" -o "../results/subsets/$safe"
          done <<'EOF'
          ${{ steps.subsets.outputs.list }}
          EOF

      - name: Gate on compare (no regressions vs P0 baseline)
        run: |
          cd boa
          fail=0
          for dir in ../results/subsets/*/; do
            ./target/release/boa_tester compare test-results-baseline/run-1 "$dir" \
              --fail-on=regression --quarantine test262_quarantine.toml || fail=1
          done
          exit $fail

      - name: Verify Test262 pin
        run: |
          cd boa
          bash scripts/verify-baseline.sh --test262-only

      - name: Upload subset results
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6f1d0e05d4a878c7efc75283e63f # v6.0.0
        with:
          name: test262-subset-results
          path: results/subsets

      - name: Compare results
        shell: bash
        run: |
          cd boa

          base_results="../data/test262/refs/heads/main/latest.json"
          pr_results="../results/test262/pull/latest.json"
          output_dir="../results/outputs"

          test -f "$base_results"
          test -f "$pr_results"

          comment="$(./target/release/boa_tester compare "$base_results" "$pr_results" -m)"
          maincommit="$(jq -r '.c' "$base_results")"

          mkdir -p "$output_dir"
          {
            echo "<!-- test262-compliance-report -->"
            echo "### Test262 conformance changes"
            echo
            echo "$comment"
            echo
            echo "Tested main commit: [\`${maincommit}\`](${{ github.event.pull_request.base.repo.html_url }}/commit/${maincommit})"
            echo "Tested PR commit: [\`${{ github.event.pull_request.head.sha }}\`](${{ github.event.pull_request.head.repo.html_url }}/commit/${{ github.event.pull_request.head.sha }})"
            echo "Compare commits: ${{ github.event.pull_request.base.repo.html_url }}/compare/${maincommit}...${{ github.event.pull_request.head.sha }}"
          } > "$output_dir/comment.md"

          echo "${{ github.event.pull_request.number }}" > "$output_dir/pr_number.txt"

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test262-results
          path: results/outputs
          retention-days: 1
